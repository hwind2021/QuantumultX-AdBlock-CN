# ============================================================================
# 开屏广告 SDK 域名精选清单（Splash Ad SDK Domains）
# ----------------------------------------------------------------------------
# 这份清单是本项目的核心资产，用于补齐上游规则对「国内 App 开屏广告」覆盖不足的问题。
#
# 经实测比对，blackmatrix7/ios_rule_script 的 AdvertisingLite 对以下 SDK 域名
# 覆盖率不足 25%（45 个关键域名仅命中 10 个），而这批域名恰恰是
# 国内 App 开屏广告的实际投放链路。
#
# 拦截优先级说明：
#   [A] 广告请求/竞价 API    —— 拦截后 App 拿不到广告，直接跳过开屏，效果最强
#   [B] SDK 配置下发         —— 拦截后 SDK 初始化降级，开屏不展示
#   [C] 广告素材 CDN         —— 拦截后素材加载超时，多数 App 容错跳过
#   [D] 曝光/点击上报        —— 不影响展示，但可切断计费与画像回传
#
# 格式：QX 分流规则（不带策略，策略由 build.py 统一注入）
# ============================================================================


