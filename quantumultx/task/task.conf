##############################################################################
# Quantumult X 定时任务示例
# ----------------------------------------------------------------------------
# 定时任务用于定期重新拉取远程脚本、执行签到类脚本等。
#
# 格式：
#     分 时 日 月 周  脚本地址或脚本名, tag=任务名称, img-url=图标地址, enabled=true
#
# cron 字段说明：
#     ┌───── 分钟 (0-59)
#     │ ┌─── 小时 (0-23)
#     │ │ ┌─ 日   (1-31)
#     │ │ │ ┌─ 月 (1-12)
#     │ │ │ │ ┌─ 星期 (0-7, 0和7都是周日)
#     │ │ │ │ │
#     * * * * *
#
# 常用写法：
#     0 5 * * *     每天凌晨 5:00
#     0 */6 * * *   每 6 小时
#     30 8 * * 1    每周一 8:30
#     0 0 1 * *     每月 1 号 0:00
#
# 说明：
#   - 直接写脚本名（如 splash-killer.js）表示引用圈 X 本地脚本
#   - 写完整 URL 表示从远程拉取
#   - img-url 用于在任务列表显示图标，可省略
##############################################################################

[task_local]

# ============================================================================
# 每日自动更新去广告脚本
# ----------------------------------------------------------------------------
# 如果你使用的是远程脚本（即在重写规则里引用了 https://...js），
# 用下面这条定期重新拉取，保证脚本始终最新。
# ============================================================================

0 5 * * * https://raw.githubusercontent.com/hwind2021/QuantumultX-AdBlock-CN/main/quantumultx/script/splash-killer.js, tag=更新·开屏去广告脚本, img-url=system://stopwatch, enabled=true

0 5 * * * https://raw.githubusercontent.com/hwind2021/QuantumultX-AdBlock-CN/main/quantumultx/script/feed-killer.js, tag=更新·信息流去广告脚本, img-url=system://stopwatch, enabled=true


# ============================================================================
# 可选：本地脚本健康检查
# ----------------------------------------------------------------------------
# 如果你把脚本保存为本地脚本，就不需要上面的远程更新任务。
# 本项目的两个脚本都是纯响应改写脚本，属于 script-response-body 类型，
# 由重写规则触发，不需要也不能作为定时任务直接执行。
# ============================================================================


# ============================================================================
# 调试用：查看脚本是否正常工作
# ----------------------------------------------------------------------------
# 开发自己的脚本时，可以用定时任务快速执行调试。
# 把 splash-killer.js 的 debug 改成 true 即可看到通知。
# ============================================================================

# */10 * * * * my-debug-script.js, tag=调试脚本, enabled=false

##############################################################################
# 国内访问 GitHub raw 较慢时，可改用 jsDelivr CDN：
#
#   把 https://raw.githubusercontent.com/hwind2021/QuantumultX-AdBlock-CN/main/
#   换成 https://cdn.jsdelivr.net/gh/hwind2021/QuantumultX-AdBlock-CN@main/
#
# 例如：
#   0 5 * * * https://cdn.jsdelivr.net/gh/hwind2021/QuantumultX-AdBlock-CN@main/quantumultx/script/splash-killer.js, tag=更新·开屏去广告脚本, enabled=true
#
# 详见 docs/08-规则订阅与每日更新.md
##############################################################################
