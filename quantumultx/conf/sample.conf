# 脚本需要在圈 X「脚本」页面手动创建，此处仅作说明
# 详见 docs/05-JS脚本使用教程.md
##############################################################################
# 需要创建的脚本：
#   1. splash-killer   ← quantumultx/script/splash-killer.js
#   2. feed-killer     ← quantumultx/script/feed-killer.js


##############################################################################
